<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title description">
  <title id="title">Keshav Jha — Still asking why.</title>
  <desc id="description">A personal mobile cover in charcoal and amber: Still asking why. Software is one way I explore the answer. Curiosity, craft, intention.</desc>
  <rect width="640" height="320" rx="12" fill="#10110d"/>
  <rect x="0.5" y="0.5" width="639" height="319" rx="11.5" fill="none" stroke="#2b2d24"/>
  <path d="M 28 38 H 54" fill="none" stroke="#ffc247" stroke-width="2"/>
  <text x="68" y="45" fill="#d5d3ca" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" letter-spacing="2">KESHAV JHA</text>
  <g fill="none" stroke="#80714a" stroke-width="1">
    <path d="M 590 26 A 19 19 0 1 0 595 49"/>
    <path d="M 578 40 L 597 21" stroke="#ffc247"/>
  </g>
  <circle cx="578" cy="40" r="3" fill="#ffc247"/>
  <text x="24" y="153" fill="#f1efe6" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="-2.7">Still asking <tspan fill="#ffc247">why.</tspan></text>
  <g fill="#a6a79d" font-family="Arial, Helvetica, sans-serif" font-size="25">
    <text x="29" y="204">Software is one way</text>
    <text x="29" y="236">I explore the answer.</text>
  </g>
  <path d="M 28 264 H 612" fill="none" stroke="#2b2d24"/>
  <text x="28" y="299" fill="#a6a79d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="1.1">CURIOSITY / CRAFT / INTENTION</text>
</svg>
